<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클레이매치 배너</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="banner banner--clay" href="https://play.google.com/store/apps/details?id=com.rujina.claymatch" target="_blank" rel="noopener" aria-label="클레이매치: 사천성 퍼즐 무료 플레이">
    <span class="app-icon" aria-hidden="true"><img src="assets/clay-match-icon.png" alt=""></span>

    </span>
    <span class="preview" aria-hidden="true"><img src="assets/clay-tile-icons.png" alt=""></span>
    <span class="cta">무료 플레이</span>
  </a>
  <script src="resize-parent.js"></script>

</html>
