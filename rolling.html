<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클레이매치 배너</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="banner banner--clay" href="https://play.google.com/store/apps/details?id=com.rujina.claymatch" target="_blank" rel="noopener" aria-label="클레이매치: 사천성 퍼즐 무료 플레이">
    <span class="copy">
      <span class="meta"><span class="badge">무료</span><span>오프라인 퍼즐</span></span>
      <strong>클레이매치 <em>사천성 퍼즐</em></strong>
      <span class="description">같은 클레이 타일을 연결해 보세요.</span>
      <span class="cta">무료 플레이</span>
    </span>
    <span class="visual" aria-hidden="true">
      <span class="hero-icon"><img src="assets/clay-match-icon.png" alt=""></span>
      <span class="clay-tile tile--tomato"></span>
      <span class="clay-tile tile--orange"></span>
      <span class="clay-tile tile--yarn"></span>
    </span>
  </a>
  <script src="resize-parent.js"></script>
</body>
</html>
